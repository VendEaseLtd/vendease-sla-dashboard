<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .page { max-width: 1400px; margin: 0 auto; }
  .header {

    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid #262a35;

  .header .title { font-size: 22px; font-weight: 700; }
  .header .subtitle { font-size: 13px; color: #8b91a3; margin-top: 3px; }
  .header .stats { display: flex; gap: 22px; }
  .header .stat { text-align: right; }
  .header .stat .n { font-size: 26px; font-weight: 700; line-height: 1; }
  .header .stat .l { font-size: 11px; color: #8b91a3; margin-top: 2px; }
  .stat.alert .n { color: #f0595a; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 14px;
  }
  .card {
    background: #171a23;
    border: 1px solid #262a35;
    border-radius: 12px;
    padding: 12px 14px;
  }
  .card.has-alerts { border-left: 3px solid #f0595a; }
  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .card-head .name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
  .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; }
  .badge.bad { background: #3a1c1e; color: #f0595a; }
  .badge.ok { background: #163524; color: #4ade80; }
  .col-head {
    display: grid;
    grid-template-columns: 1fr 52px 52px 46px 56px;
    gap: 6px;
    padding: 0 0 5px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #5b6072;
  }
  .col-head span:not(:first-child) { text-align: right; }
  .row {
    display: grid;
    grid-template-columns: 1fr 52px 52px 46px 56px;
    align-items: center;
    gap: 6px;
    padding: 6px 0;
    font-size: 12.5px;
    border-top: 1px solid #21242e;
  }
  .row:first-of-type { border-top: none; }
  .loc { white-space: normal; word-break: normal; line-height: 1.3; padding-right: 4px; display: block; }
  .serial { display: block; font-size: 10px; color: #5b6072; margin-top: 1px; font-family: monospace; }
  .pill { text-align: right; font-size: 10.5px; font-weight: 600; padding: 2px 6px; border-radius: 4px; white-space: nowrap; justify-self: end; }
  .pill.danger { background: #3a1c1e; color: #f0595a; }
  .pill.warning { background: #3a2e14; color: #eab308; }
  .pill.ok { background: #163524; color: #4ade80; }
  .all-clear { display: flex; align-items: center; gap: 5px; padding: 5px 0; font-size: 12.5px; color: #4ade80; }
  .footer { margin-top: 16px; font-size: 11px; color: #5b6072; text-align: right; }
  .footer .push-time { margin-top: 3px; }
</style>

// Partners with an SLA breach (alerts.length > 0) always come first, sorted by
// most breaches first; partners with no breaches follow, in their usual order.
const PARTNERS = [...BASE_ORDER].sort((a, b) => {
  const pa = DATA.partners[a], pb = DATA.partners[b];
  const aCount = pa ? pa.alerts.length : 0;
  const bCount = pb ? pb.alerts.length : 0;
  if (aCount === 0 && bCount === 0) return 0; // keep original relative order
  return bCount - aCount;
});

function pillClass(pct) {
  if (pct === null || pct === undefined) return 'ok';
  if (pct <= 10) return 'danger';
  if (pct <= 24) return 'warning';
  return 'ok';
}

function pill(pct) {
  if (pct === null || pct === undefined) return '<span class="pill">n/a</span>';
  const c = pillClass(pct);
  return `<span class="pill ${c}">${Math.floor(pct)}%</span>`;
}

function daysSince(ds) {
  const ref = new Date(DATA.run_date || DATA.date);
  return Math.max(1, Math.round((ref - new Date(ds)) / 86400000) + 1);
}

function onlinePill(status) {
  const isOnline = status === 'Online';
  const isUnknown = status !== 'Online' && status !== 'Offline';
  if (isUnknown) return '<span class="pill">?</span>';
  return `<span class="pill ${isOnline ? 'ok' : 'danger'}">${isOnline ? 'Yes' : 'No'}</span>`;
}

const runD = new Date(DATA.run_date || DATA.date);
document.getElementById('hdr-date').textContent = runD.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) + (DATA.run_time ? ' \u00b7 ' + DATA.run_time : '');

let totalAlerts = 0, totalMachines = 0;
PARTNERS.forEach(p => {
  const pd = DATA.partners[p];
  if (!pd) return;
  totalMachines += pd.total || 0;
  totalAlerts += pd.alerts.length;
});
document.getElementById('hdr-alerts').textContent = totalAlerts;
document.getElementById('hdr-machines').textContent = totalMachines;

let html = '';
PARTNERS.forEach(p => {
  const pd = DATA.partners[p];
  if (!pd) return;
  const alerts = pd.alerts;
  const hasAlerts = alerts.length > 0;
  const icon = ICONS[p] || '\ud83c\udfe2';
  html += `<div class="card ${hasAlerts ? 'has-alerts' : ''}">
    <div class="card-head">
      <span class="name"><span>${icon}</span>${p}</span>
      <span class="badge ${hasAlerts ? 'bad' : 'ok'}">${alerts.length}/${pd.total}</span>
    </div>`;
  if (!hasAlerts) {
    html += `<div class="all-clear">&#10003; All clear</div>`;
  } else {
    html += `<div class="col-head"><span>Location</span><span>Water</span><span>Snack</span><span>Days</span><span>Online</span></div>`;
    alerts.forEach(a => {
      const days = DATA.tracking[a.serial] ? daysSince(DATA.tracking[a.serial]) : 1;
      const dayTag = days > 1 ? `<span class="pill ok">${days}d</span>` : '<span class="pill ok">new</span>';
      html += `<div class="row">
        <span class="loc">${a.location}<span class="serial">${a.serial}</span></span>
        ${pill(a.water_pct)}
        ${pill(a.snack_pct)}
        ${dayTag}
        ${onlinePill(a.online)}
      </div>`;
    });
  }
  html += `</div>`;
});
document.getElementById('grid').innerHTML = html;
document.getElementById('footer').textContent = 'Water = Radnor/Strathmore stock \u00b7 Snacks = chocolate/crisps/bars stock';
document.getElementById('footer-push').textContent = DATA.last_github_push
  ? 'Last uploaded to GitHub: ' + DATA.last_github_push
  : 'First dashboard run \u2014 no prior history to compare against';

// Departure-board style auto-paging: jump down one screen, hold, jump to the
// next, and loop back to the top once the bottom is reached. Only runs when
// the page is actually taller than the viewport (i.e. once partner cards
// overflow one screen) - on a single screen's worth of content it does nothing.
(function () {
  const HOLD_MS = 6000; // time to hold at each screen before jumping
  let timer = null;

  function maxScroll() {
    return Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
  }

  function hasOverflow() {
    return maxScroll() > 20;
  }

  function jumpToNextScreen() {
    if (!hasOverflow()) return;
    const max = maxScroll();
    const next = window.scrollY + window.innerHeight;
    window.scrollTo(0, next >= max - 5 ? 0 : next);
  }

  function restart() {
    if (timer) clearInterval(timer);
    timer = hasOverflow() ? setInterval(jumpToNextScreen, HOLD_MS) : null;
  }

  window.addEventListener('load', restart);
  window.addEventListener('resize', restart);
})();
</script>
</body>
</html>
